name: vm-features

templates:
  - name: ubuntu-26.04
    path: "${TOPOLAB_TEMPLATE:?set TOPOLAB_TEMPLATE to an Ubuntu 26.04 amd64 cloud image}"

storages:
  - {name: snapshots, type: file, root_provisioning: snapshot}
  - {name: copies, type: file, root_provisioning: copy}

management_host:
  interfaces:
    - name: management
      ipv4:
        addresses: [192.0.2.254/24]

vms:
  - name: feature-rich
    template: ubuntu-26.04
    cpu: {model: host, sockets: 1, cores: 4, threads: 1}
    memory_mb: 4096
    memory_balloon: {enabled: true, target_mb: 3072}
    root_disk: {size_gib: 8, bus: scsi, storage: snapshots}
    additional_disks:
      - {name: data, size_gib: 2, bus: virtio, storage: copies}
      - {name: archive, size_gib: 1, bus: nvme, storage: snapshots}
    guest_agent: true
    boot: {order: [disk, network], menu: true, strict: true}
    ssh_authorized_keys:
      - "${TOPOLAB_SSH_PUBLIC_KEY:?set TOPOLAB_SSH_PUBLIC_KEY to an OpenSSH public key}"
    root_ca_certificates:
      - pem: "${TOPOLAB_ROOT_CA_PEM:?set TOPOLAB_ROOT_CA_PEM to a self-signed Root CA certificate}"
    interfaces:
      - name: primary
        model: virtio
        queues: 4
        ipv4:
          addresses: [192.0.2.10/24]
          routes: [{to: default, via: 192.0.2.1}]
          dns_servers: [1.1.1.1]
      - name: legacy
        model: e1000e
  - name: lifecycle
    template: ubuntu-26.04
    root_disk: {bus: virtio, storage: copies}
    additional_disks:
      - {name: state, size_gib: 1, bus: scsi, storage: snapshots}
    boot: {order: [network, disk]}
    ssh_authorized_keys:
      - "${TOPOLAB_SSH_PUBLIC_KEY:?set TOPOLAB_SSH_PUBLIC_KEY to an OpenSSH public key}"
    root_ca_certificates:
      - path: "${TOPOLAB_ROOT_CA_PATH:?set TOPOLAB_ROOT_CA_PATH to a self-signed Root CA certificate file}"
    interfaces:
      - name: primary
        ipv4:
          addresses: [192.0.2.11/24]
          routes: [{to: default, via: 192.0.2.1}]
          dns_servers: [1.1.1.1]

routers:
  - name: edge
    interfaces:
      - name: management
        ipv4:
          addresses: [192.0.2.1/24]
      - name: external
        external:
          sources: [192.0.2.0/24]
          egress_interface: auto
          source_ip: auto

switches:
  - name: management-net
  - name: isolated-net

links:
  - name: management-host
    endpoints:
      - {node: management_host, interface: management}
      - {node: management-net, interface: management}
  - name: feature-primary
    endpoints:
      - {node: feature-rich, interface: primary}
      - {node: management-net, interface: feature-rich}
  - name: lifecycle-primary
    endpoints:
      - {node: lifecycle, interface: primary}
      - {node: management-net, interface: lifecycle}
  - name: feature-legacy
    endpoints:
      - {node: feature-rich, interface: legacy}
      - {node: isolated-net, interface: feature-rich}
  - name: edge-management
    endpoints:
      - {node: edge, interface: management}
      - {node: management-net, interface: edge}
