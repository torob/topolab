<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520" role="img" aria-labelledby="title desc">
  <title id="title">TopoLab routed example</title><desc id="desc">An application and management host share a service network behind a dual-homed gateway VM. An edge namespace router connects the transit network, a client network, and the Internet.</desc>
  <defs><style>.bg{fill:#f8fafc}.vm{fill:#e0f2fe;stroke:#334155;stroke-width:2}.router{fill:#ede9fe;stroke:#334155;stroke-width:2}.switch{fill:#dcfce7;stroke:#334155;stroke-width:2}.host{fill:#fef3c7;stroke:#334155;stroke-width:2}.cloud{fill:#fee2e2;stroke:#991b1b;stroke-width:2}.link{stroke:#475569;stroke-width:4}.label{font:bold 16px sans-serif;fill:#0f172a}.small{font:12px sans-serif;fill:#334155}.net{font:13px sans-serif;fill:#7c3aed}</style></defs><rect class="bg" width="1080" height="520"/>
  <path class="link" d="M210 230H330M480 230H580M730 230H850M655 160V95M925 160V95M405 300V375M160 300V375"/>
  <rect class="switch" x="330" y="190" width="150" height="80" rx="12"/><text class="label" x="405" y="225" text-anchor="middle">service-net</text><text class="small" x="405" y="247" text-anchor="middle">192.0.2.0/24</text>
  <rect class="vm" x="40" y="190" width="170" height="110" rx="14"/><text class="label" x="125" y="225" text-anchor="middle">application VM</text><text class="small" x="125" y="250" text-anchor="middle">192.0.2.10</text>
  <rect class="vm" x="580" y="180" width="150" height="120" rx="14"/><text class="label" x="655" y="215" text-anchor="middle">gateway VM</text><text class="small" x="655" y="240" text-anchor="middle">192.0.2.1</text><text class="small" x="655" y="260" text-anchor="middle">198.51.100.2</text><text class="small" x="655" y="281" text-anchor="middle">guest NAT #1</text>
  <rect class="switch" x="600" y="35" width="110" height="60" rx="10"/><text class="label" x="655" y="62" text-anchor="middle">transit</text><text class="small" x="655" y="82" text-anchor="middle">/30</text>
  <rect class="router" x="850" y="170" width="150" height="130" rx="14"/><text class="label" x="925" y="205" text-anchor="middle">edge router</text><text class="small" x="925" y="230" text-anchor="middle">namespace</text><text class="small" x="925" y="252" text-anchor="middle">host NAT #2</text>
  <rect class="switch" x="850" y="35" width="150" height="60" rx="10"/><text class="label" x="925" y="62" text-anchor="middle">client-net</text><text class="small" x="925" y="82" text-anchor="middle">203.0.113.0/24</text>
  <rect class="vm" x="850" y="375" width="150" height="90" rx="14"/><text class="label" x="925" y="410" text-anchor="middle">client VM</text><text class="small" x="925" y="435" text-anchor="middle">203.0.113.10</text><path class="link" d="M925 300V375"/>
  <rect class="host" x="305" y="375" width="200" height="90" rx="14"/><text class="label" x="405" y="410" text-anchor="middle">management_host</text><text class="small" x="405" y="435" text-anchor="middle">192.0.2.254 · isolated NS</text>
  <path class="link" d="M1000 235H1045"/><path class="cloud" d="M1015 140c-30-30 18-62 42-35 26-22 56 7 39 31 34 12 22 60-12 60h-55c-35 0-42-42-14-56z"/><text class="label" x="1052" y="155" text-anchor="middle">Internet</text>
  <text class="net" x="520" y="215">routed</text><text class="net" x="775" y="215">routed</text>
  <rect x="30" y="475" width="530" height="30" rx="6" fill="#fff" stroke="#cbd5e1"/><text class="small" x="45" y="495">Legend: blue VM · violet namespace router · green switch · amber management host · red external network</text>
</svg>
