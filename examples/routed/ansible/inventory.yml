all:
  vars:
    ansible_user: torob
    ansible_ssh_private_key_file: "{{ lookup('env', 'ROUTED_SSH_PRIVATE_KEY') }}"
    ansible_ssh_common_args: >-
      -o IdentitiesOnly=yes -o StrictHostKeyChecking=no
      -o UserKnownHostsFile=/dev/null
  children:
    managed_nodes:
      hosts:
        gateway: {ansible_host: 192.0.2.1}
        application: {ansible_host: 192.0.2.10}
