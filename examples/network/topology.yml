name: network

management_host:
  interfaces:
    - name: management
      ipv4:
        addresses: [192.0.2.254/24]

routers:
  - name: left
    interfaces:
      - name: trunk
        vlans:
          - id: 10
            ipv4:
              addresses: [192.0.2.1/24]
  - name: right
    interfaces:
      - name: access
        ipv4:
          addresses: [192.0.2.2/24]

switches:
  - name: lan
    vlan_filtering: true

links:
  - name: left-lan
    endpoints:
      - node: left
        interface: trunk
        egress:
          latency_ms: 20
          jitter_ms: 2
          loss_percent: 1
          rate_mbps: 100
      - node: lan
        interface: left
        port: {mode: trunk, allowed_vlans: [10]}
  - name: right-lan
    endpoints:
      - {node: right, interface: access}
      - {node: lan, interface: right, port: {mode: access, vlan: 10}}
  - name: management-lan
    endpoints:
      - {node: management_host, interface: management}
      - {node: lan, interface: management, port: {mode: access, vlan: 10}}
