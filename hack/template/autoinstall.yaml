#cloud-config
autoinstall:
  version: 1
  identity:
    hostname: topolab-template
    username: image-builder
    password: "!"
  refresh-installer:
    update: false
  source:
    search_drivers: false
    id: ubuntu-server
  network:
    version: 2
    ethernets: {}
  apt:
    geoip: false
  ssh:
    install-server: true
    allow-pw: false
  timezone: Etc/UTC
  locale: en_US.UTF-8
  keyboard:
    layout: us
  storage:
    config:
      - id: disk0
        type: disk
        match: {size: largest}
        ptable: gpt
        wipe: superblock-recursive
        preserve: false
      - id: part-efi
        type: partition
        device: disk0
        size: 512M
        flag: boot
        grub_device: true
      - id: part-boot
        type: partition
        device: disk0
        size: 1G
      - id: part-root
        type: partition
        device: disk0
        size: -1
      - id: fs-efi
        type: format
        volume: part-efi
        fstype: fat32
      - id: fs-boot
        type: format
        volume: part-boot
        fstype: ext4
      - id: fs-root
        type: format
        volume: part-root
        fstype: ext4
      - id: mount-root
        type: mount
        device: fs-root
        path: /
      - id: mount-boot
        type: mount
        device: fs-boot
        path: /boot
      - id: mount-efi
        type: mount
        device: fs-efi
        path: /boot/efi
  late-commands:
    - curtin in-target --target=/target -- systemctl enable qemu-guest-agent.service
    - >-
      curtin in-target --target=/target -- sh -c
      'printf "%s\\n" "datasource_list: [ NoCloud ]" > /etc/cloud/cloud.cfg.d/90-topolab-datasource.cfg;
      printf "%s\\n" "network: null" > /etc/cloud/cloud.cfg.d/99-topolab-network.cfg'
    - >-
      curtin in-target --target=/target -- sh -c
      'passwd -l image-builder; rm -f /etc/ssh/ssh_host_*; truncate -s 0 /etc/machine-id;
      rm -f /var/lib/dbus/machine-id /etc/cloud/cloud.cfg.d/50-curtin-networking.cfg
      /etc/netplan/00-installer-config.yaml /etc/netplan/50-cloud-init.yaml;
      cloud-init clean --logs --seed; rm -rf /var/lib/cloud/instances/*'
    - curtin in-target --target=/target -- grub-install --target=x86_64-efi --efi-directory=/boot/efi --bootloader-id=ubuntu --removable --recheck
