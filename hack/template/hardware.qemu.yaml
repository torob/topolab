boot_firmware: uefi
disk_size: 20G
vcpu: 2
memory_mb: 2048
qemu:
  cpu_model: host
  # The v1.3.0 builder attaches the installer with its legacy -drive mapping;
  # use VirtIO here. The installed generic kernel/initramfs also contains the
  # virtio-scsi driver used by TopoLab's default root-disk bus.
  disk_interface: virtio
  iso_interface: virtio
