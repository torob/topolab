name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Check formatting
        run: |
          unformatted=$(find . -type f -name '*.go' -print0 | xargs -0 gofmt -l)
          test -z "$unformatted" || {
            printf 'Files need gofmt:\n%s\n' "$unformatted"
            exit 1
          }

      - name: Run unit tests
        run: make test

      - name: Run race tests
        run: make test-race

      - name: Run vet
        run: make vet

      - name: Build
        run: |
          make build
          artifact=$(file bin/topolab)
          build_info=$(go version -m bin/topolab)
          printf '%s\n' "$artifact"
          printf '%s\n' "$build_info"
          grep -F 'statically linked' <<<"$artifact"
          grep -F 'stripped' <<<"$artifact"
          grep -F 'CGO_ENABLED=0' <<<"$build_info"
          grep -F -- '-trimpath=true' <<<"$build_info"

      - name: Check Python syntax
        run: python3 -m py_compile $(find e2e -type f -name '*.py' -print)

      - name: Check shell syntax
        run: find e2e -type f -name '*.sh' -exec sh -n {} +

      - name: Run ShellCheck
        run: find e2e -type f -name '*.sh' -print0 | xargs -0 shellcheck --severity=warning --shell=sh

      - name: Normalize example configurations
        run: |
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/example-key"
          python3 -c 'import struct,sys; open(sys.argv[1], "wb").write(struct.pack(">4sIQQ", b"QFI\xfb", 3, 0, 0))' "$RUNNER_TEMP/placeholder.qcow2"
          export TOPOLAB_TEMPLATE="$RUNNER_TEMP/placeholder.qcow2"
          export TOPOLAB_SSH_PUBLIC_KEY="$(cat "$RUNNER_TEMP/example-key.pub")"
          for topology in examples/*/topology.yml; do
            ./bin/topolab --file "$topology" \
              --working-dir "$RUNNER_TEMP/config" config >/dev/null
          done

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.5.0

      - name: Check for reachable vulnerabilities
        run: govulncheck ./...
